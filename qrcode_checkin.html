<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mã QR Chấm Công - Nguyễn Hữu Trí</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .qr-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        .company-name {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .qr-wrapper {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 2px dashed #cbd5e1;
            display: inline-block;
            margin-bottom: 20px;
        }
        .qr-image {
            width: 240px;
            height: 240px;
            display: block;
        }
        .badge {
            display: inline-block;
            background: #ecfdf5;
            color: #059669;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .footer-text {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="qr-card">
        <div class="badge">ĐIỂM DANH TẠI VĂN PHÒNG</div>
        <div class="company-name">CÔNG TY NGUYỄN HỮU TRÍ</div>
        <div class="subtitle">Quét mã bên dưới bằng ứng dụng di động để Check-in vào ca</div>
        
        <div class="qr-wrapper">
            <!-- Mã QR chứa chuỗi bí mật điểm danh của công ty -->
            <img class="qr-image" 
                 src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=NGUYENHUUTRI_ATTENDANCE_CHECKIN_VERIFIED_2026" 
                 alt="QR Code Chấm Công">
        </div>

        <div class="footer-text">
            Mã định danh bảo mật: <b>NGUYENHUUTRI_2026</b><br>
            Vui lòng đứng trong khu vực sảnh văn phòng khi quét.
        </div>
    </div>
</body>
</html>
